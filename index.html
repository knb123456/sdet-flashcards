<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDET Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Topic Filter -->
  <button id="filterToggleBtn">Topics</button>
<div class="filter-container" id="filterContainer">
  <div id="topicCheckboxes"></div>
</div>

  <!-- Flashcard Container -->
  <div class="flashcard-container">
    <div class="flashcard">
      <span id="topic" class="flashcard-topic"></span>
      <div id="question" class="flashcard-question">Loading...</div>
    </br>
      <div id="answer" class="flashcard-answer"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button id="prevBtn">Previous</button>
    <button id="showAnswerBtn">Show Answer</button>
    <button id="nextBtn">Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
